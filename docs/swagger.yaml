basePath: /v1
definitions:
  model.CategoryInput:
    properties:
      description:
        type: string
      image_url:
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 150
        type: string
      slug:
        maxLength: 150
        type: string
    required:
    - name
    - slug
    type: object
  model.CategoryUpdateInput:
    properties:
      description:
        type: string
      image_url:
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 150
        type: string
      slug:
        maxLength: 150
        type: string
    required:
    - name
    - slug
    type: object
  model.CreateRoleInput:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - description
    - name
    type: object
  model.CreateUserInput:
    properties:
      address:
        type: string
      email:
        type: string
      full_name:
        type: string
      password:
        maxLength: 100
        minLength: 8
        type: string
      phone_number:
        type: string
      role_id:
        type: integer
    required:
    - address
    - email
    - full_name
    - phone_number
    - role_id
    type: object
  model.InventoryAdjustmentInput:
    properties:
      product_variant_id:
        type: string
      quantity:
        type: integer
    required:
    - product_variant_id
    - quantity
    type: object
  model.InventoryOperationInput:
    properties:
      product_variant_id:
        type: string
      quantity:
        type: integer
    required:
    - product_variant_id
    - quantity
    type: object
  model.LoginInput:
    properties:
      email:
        type: string
      password:
        maxLength: 100
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  model.LogoutRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  model.Product:
    properties:
      category_id:
        type: integer
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      id:
        type: string
      images:
        items:
          $ref: '#/definitions/model.ProductImage'
        type: array
      is_active:
        type: boolean
      name:
        type: string
      short_desc:
        type: string
      slug:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
    type: object
  model.ProductImage:
    properties:
      created_at:
        type: string
      id:
        type: string
      image_public_id:
        type: string
      image_url:
        type: string
      is_primary:
        type: boolean
      product_id:
        type: string
      sort_order:
        type: integer
      updated_at:
        type: string
    type: object
  model.ProductInput:
    properties:
      category_id:
        type: integer
      description:
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 150
        type: string
      short_desc:
        type: string
      slug:
        maxLength: 150
        type: string
    required:
    - category_id
    - name
    - slug
    type: object
  model.ProductVariant:
    properties:
      barcode:
        type: string
      color:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      price:
        type: number
      product:
        $ref: '#/definitions/model.Product'
      product_id:
        type: string
      size:
        type: string
      sku:
        type: string
      updated_at:
        type: string
      weight:
        type: number
    type: object
  model.ProductVariantInput:
    properties:
      barcode:
        maxLength: 100
        type: string
      color:
        maxLength: 100
        type: string
      is_active:
        type: boolean
      price:
        type: number
      size:
        maxLength: 50
        type: string
      sku:
        maxLength: 50
        type: string
      weight:
        minimum: 0
        type: number
    required:
    - price
    - sku
    type: object
  model.ProductVariantUpdateInput:
    properties:
      barcode:
        maxLength: 100
        type: string
      color:
        maxLength: 100
        type: string
      is_active:
        type: boolean
      price:
        type: number
      product_id:
        type: string
      size:
        maxLength: 50
        type: string
      sku:
        maxLength: 50
        type: string
      weight:
        minimum: 0
        type: number
    required:
    - price
    - product_id
    - sku
    type: object
  model.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  model.UpdateRoleInput:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - description
    - name
    type: object
  model.UpdateUserInput:
    properties:
      address:
        type: string
      email:
        type: string
      full_name:
        type: string
      password:
        maxLength: 100
        minLength: 8
        type: string
      phone_number:
        type: string
      role_id:
        type: integer
    required:
    - address
    - email
    - full_name
    - phone_number
    - role_id
    type: object
info:
  contact: {}
  description: REST API for IVLOLITAS Ecommerce
  title: IVLOLITAS API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user using email and password
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: User Login
      tags:
      - Authentication
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Logout current user by invalidating refresh token
      parameters:
      - description: Logout Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - Authentication
  /auth/logout-all:
    post:
      description: Invalidate all refresh tokens of current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Logout All Devices
      tags:
      - Authentication
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Get new access token using refresh token
      parameters:
      - description: Refresh Token
        in: body
        name: request
        required: true
        schema:
